# TaskFlow - Nginx site config (Stage 1: plain HTTP on EC2).
#
# Install:
#   sudo cp deploy/nginx/taskflow.conf /etc/nginx/sites-available/taskflow
#   sudo ln -s /etc/nginx/sites-available/taskflow /etc/nginx/sites-enabled/taskflow
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# When you add a domain, replace "server_name _;" with "server_name your-domain.com;" and run
# `sudo certbot --nginx -d your-domain.com`. Certbot adds the HTTPS server block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # React production build (copied here by deploy/scripts/deploy.sh)
    root /var/www/taskflow;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Security headers. NOTE: add_header in a location block REPLACES the server-level ones
    # for that location (an Nginx inheritance gotcha), which is why /assets/ is kept simple.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API: forwarded to Express, which listens only on 127.0.0.1:5000 (never exposed publicly).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Vite emits content-hashed filenames in /assets, so they can be cached "forever".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html so React Router can handle them.
    location / {
        try_files $uri /index.html;
    }
}
